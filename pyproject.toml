[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kxne-sniper"
version = "1.0.0"
description = "Multithreaded username availability sniper with live dashboard"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9.0", "aiohttp-socks>=0.9.0", "rich>=13.7.0"]

[project.scripts]
kxne-sniper = "kxne_sniper.main:main"

[tool.setuptools.packages.find]
include = ["kxne_sniper*"]
